version: '3.8'

# Bu dosya, bilgisayarında Postgres'i KURMADAN, Docker üzerinden çalıştırmanı sağlar.
# Docker Desktop kurulu olması yeterli (https://www.docker.com/products/docker-desktop/).
# Çalıştırmak için: docker-compose up -d
# Durdurmak için: docker-compose down

services:
  postgres:
    image: postgres:16
    container_name: muteahhit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: muteahhit_db
    ports:
      - "5432:5432"
    volumes:
      - muteahhit_pg_data:/var/lib/postgresql/data

volumes:
  muteahhit_pg_data:
