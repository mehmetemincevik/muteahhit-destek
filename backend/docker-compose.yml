# Geliştirme ortamı için PostgreSQL.
#   docker compose up -d     başlat
#   docker compose down      durdur
# Veri muteahhit_pg_data volume'ünde kalır; tamamen silmek için `down -v`.

services:
  postgres:
    image: postgres:16
    container_name: muteahhit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: muteahhit_db
    ports:
      - "5432:5432"
    volumes:
      - muteahhit_pg_data:/var/lib/postgresql/data

volumes:
  muteahhit_pg_data:
